<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emsi'ye Hoş Geldin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f4f93">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Emsi Oyun">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@700&family=Patrick+Hand&family=Montserrat:wght@800&display=swap">
<style>
/* Layout: "Görevi Tamamla" afişi — mavi radyal zemin, el yazısı beyaz metin, kareli onay kutulu liste, altta EMSÎ */
:root{
  --deep:#1f4f93; --mid:#0d7cc6; --text:#ffffff; --soft:rgba(255,255,255,.78);
  --box:#e9e9ea; --box-ink:#1f4f93; --orange:#f7a23b; --shadow:rgba(6,24,60,.35);
  --title:"Mali","Comic Sans MS",cursive;
  --hand:"Patrick Hand","Comic Sans MS",cursive;
  --logo:"Montserrat",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--deep)}
body{margin:0;min-height:100dvh;color:var(--text);font-family:var(--hand);font-size:20px;line-height:1.45;
  background:radial-gradient(ellipse 75% 60% at 50% 45%,var(--mid) 0%,#155fa8 45%,var(--deep) 100%) fixed,var(--deep);
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:26px;
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
h1{font-family:var(--title);font-weight:700;font-size:clamp(40px,10vw,74px);line-height:1;margin:0;letter-spacing:.02em;text-shadow:0 3px 0 var(--shadow)}
header svg{width:clamp(54px,12vw,92px);height:auto;flex:none;filter:drop-shadow(0 3px 2px var(--shadow))}
.sub{margin:-12px 0 0;text-align:center;color:var(--soft);font-size:19px}
.em{color:var(--orange)}
button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.draw{align-self:center;min-height:54px;padding:10px 30px;border-radius:14px;background:var(--orange);color:#3a2200;
  font-family:var(--title);font-weight:700;font-size:24px;letter-spacing:.03em;box-shadow:0 5px 0 #c97a17,0 8px 18px var(--shadow);transition:transform .1s,box-shadow .1s}
.draw:active{transform:translateY(4px);box-shadow:0 1px 0 #c97a17,0 3px 8px var(--shadow)}
.steps{display:flex;justify-content:center;gap:10px}
.step{width:42px;height:42px;border-radius:3px;background:rgba(233,233,234,.25);color:var(--box-ink);display:grid;place-items:center;
  font-family:var(--title);font-weight:700;font-size:18px;color:var(--text);box-shadow:0 2px 0 var(--shadow);transition:background .25s,transform .25s}
.step.done{background:var(--box);color:var(--box-ink)}
.step.now{background:transparent;outline:3px solid var(--orange);outline-offset:-3px;color:var(--orange);transform:scale(1.08)}
.step svg{width:28px;height:28px}
.meter{text-align:center;color:var(--soft);font-size:18px;margin-top:-10px}
.card{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 10px 30px var(--shadow);animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
.card .label{font-family:var(--title);font-weight:700;font-size:16px;letter-spacing:.12em;color:var(--orange)}
.card .txt{font-size:28px;line-height:1.3;overflow-wrap:anywhere;text-wrap:balance}
.donelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.donelist li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;opacity:.75}
.donelist .mini{width:28px;height:28px;border-radius:3px;background:var(--box);color:var(--box-ink);display:grid;place-items:center}
.donelist .mini svg{width:20px;height:20px}
.donelist span{min-width:0;padding-top:1px;text-decoration:line-through;text-decoration-thickness:2px;overflow-wrap:anywhere}
.donehead{font-family:var(--title);font-weight:700;font-size:15px;letter-spacing:.12em;color:var(--soft)}
#doneBox{display:flex;flex-direction:column;gap:12px}
#doneBox[hidden]{display:none}
.empty{text-align:center;color:var(--soft);border:2px dashed rgba(255,255,255,.4);border-radius:12px;padding:26px 16px}
.win{text-align:center;font-family:var(--title);font-weight:700;font-size:30px;color:var(--orange);text-shadow:0 2px 0 var(--shadow);animation:pop .4s ease-out}
footer{margin-top:auto;display:flex;flex-direction:column;align-items:center;padding-top:20px}
.logo{font-family:var(--logo);font-weight:800;font-size:44px;letter-spacing:.02em;line-height:1}
.logo-shadow{width:150px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(6,24,60,.45),transparent);margin-top:6px}
@media (max-width:560px){
  body{font-size:19px;background-attachment:scroll}
  .wrap{gap:20px;padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(22px + env(safe-area-inset-bottom,0px))}
  header{gap:6px}
  h1{font-size:clamp(22px,7vw,38px);white-space:nowrap}
  header svg{width:clamp(34px,9.5vw,52px)}
  .sub{font-size:17px;margin-top:-8px}
  .draw{align-self:stretch;min-height:58px;font-size:22px}
  .steps{gap:8px}
  .step{width:clamp(36px,11vw,46px);height:clamp(36px,11vw,46px)}
  .card{padding:22px 18px}
  .card .txt{font-size:25px}
  .win{font-size:26px}
  .logo{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>GÖREVLERİ TAMAMLA</h1>
    <svg viewBox="0 0 100 90" aria-hidden="true">
      <circle cx="58" cy="52" r="24" fill="#cfe2f5" stroke="#2b2f36" stroke-width="7"/>
      <circle cx="58" cy="52" r="15" fill="#e8f2fb" opacity=".7"/>
      <path d="M40 70 L14 86" stroke="#2b2f36" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="54" cy="30" rx="34" ry="8" fill="#2b2f36"/>
      <path d="M30 30 C30 10 40 4 54 4 C68 4 78 10 78 30 Z" fill="#3a3f47"/>
      <path d="M31 22 L77 22 L78 30 L30 30 Z" fill="#f2f2f2"/>
    </svg>
  </header>
  <p class="sub"><span class="em">Emsi</span>'ye hoş geldin! 5 görevin var, her biri sen bir öncekini yapınca gelecek. Görevler değiştirilemez!</p>

  <div class="steps" id="steps" hidden></div>
  <div class="meter" id="meter" hidden></div>

  <div id="stage"></div>

  <button class="draw" id="draw">İLK GÖREVİMİ ÇEK</button>

  <div id="doneBox" hidden>
    <div class="donehead">TAMAMLANANLAR</div>
    <ul class="donelist" id="doneList"></ul>
  </div>

  <footer>
    <div class="logo" aria-label="EMSÎ">EMSÎ</div>
    <div class="logo-shadow"></div>
  </footer>
</div>

<script>
const POOL = [
  "5 kişiyi bir araya topla ve fotoğraf çek",
  "etkinlik alanında oryantasyon liderini bul ve fotoğraf çek",
  "emsi'de 2 yıl ve üzeri bir kişiyi bul ve ona bir içki ısmarlat",
  "kalabalık bir grup içerisinde Çağrı göttür diye bağır",
  "mavi giyen 1 kişi bul ve fotoğraf çektir",
  "bir bardak su iç",
  "Oryantasyon liderinle fotoğraf çekil, Emsi Story’de paylaş.",
  "Arzumsu'yu bul.",
  "En az 1 yıldır EMSÎ üyesi olan bir arkadaşımızı bul, seni 3 eski üyeyle tanıştırsın.",
  "Emsi Tweet’e “Buradayım be buradayım! #artıkemsiliyim” yazıp paylaş!",
  "Ve en önemlisi, bolca eğlen!",
  "Oryantasyon ekibinden en az iki kişiyle tanışıp selfie çek",
  "Emsi story’e partiden bir fotoğraf at",
  "Çağrı göttür dendiğinde “Eyyyy” diyerek kadeh kaldır",
  "En az iki senedir toplulukta olan birinden sana bi bira ısmarlamasını iste (ısmarlamazsa göttür)",
  "Yılın Enleri adaylarından birine aday olmanın nasıl hissettirdiğini sor",
  "En az 20 kişiyle tanış, aynı meslekten 2 kişiyi tanıştır",
];
const LAST = "Emsi Tweet’e “Görevi tamamladım, artık ben de Emsi’liyim” yaz";
const N = 5, KEY = "emsi-oyun-v9";
let drawn = [];
try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) drawn = s.filter(d => POOL.includes(d.t) || d.t === LAST); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(drawn)); } catch (e) {} };
const $ = id => document.getElementById(id);
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmt(s){return esc(s).replace(/(Emsi|EMSÎ|emsi)(?=[^a-zA-ZçğıöşüÇĞİÖŞÜ]|$)/g,'<span class="em">$1</span>')}

function pick(){ const used = new Set(drawn.map(d => d.t)); const c = POOL.filter(t => !used.has(t)); return c[Math.random() * c.length | 0]; }
function draw(){ drawn = []; drawn.push({ t: pick(), done: false }); save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function render(){
  const n = drawn.length ? N : 0, done = drawn.filter(d => d.done).length, cur = drawn.findIndex(d => !d.done), finished = done === N;
  $("steps").hidden = $("meter").hidden = !n;
  $("steps").innerHTML = Array.from({ length: n }, (_, i) => { const d = drawn[i] || {};
    return `<div class="step${d.done ? ' done' : ''}${i === cur ? ' now' : ''}" aria-label="Görev ${i + 1}${d.done ? ' tamamlandı' : ''}">${d.done ? CHECK : (i === cur ? i + 1 : '?')}</div>`; }).join("");
  $("meter").textContent = finished ? `${n} / ${n} görev tamamlandı` : `${done} / ${n} görev tamamlandı`;

  if (!n) $("stage").innerHTML = '<div class="empty">“İlk Görevimi Çek”e bas, ilk görevin gelsin.</div>';
  else if (finished) $("stage").innerHTML = '<div class="win">Tebrikler, artık sen de <span class="em">Emsi</span>\'lisin!</div>';
  else $("stage").innerHTML = `<div class="card" key="${cur}"><div class="label">GÖREV ${cur + 1} / ${n}</div><div class="txt">${fmt(drawn[cur].t)}</div></div>`;

  const b = $("draw");
  b.textContent = !n ? "İLK GÖREVİMİ ÇEK" : finished ? "YENİ GÖREVLER ÇEK" : "YAPTIM ✓";
  b.dataset.mode = !n ? "draw" : finished ? "again" : "next";

  const list = drawn.filter(d => d.done);
  $("doneBox").hidden = !list.length;
  $("doneList").innerHTML = list.map(d => `<li><div class="mini">${CHECK}</div><span>${fmt(d.t)}</span></li>`).join("");
}
$("draw").addEventListener("click", e => {
  const m = e.currentTarget.dataset.mode;
  if (m === "draw" || m === "again") draw();
  else if (m === "next") { const i = drawn.findIndex(d => !d.done); if (i > -1) { drawn[i].done = true; if (drawn.length < N) drawn.push({ t: drawn.length === N - 1 ? LAST : pick(), done: false }); save(); render(); } }
});
render();
</script>
</body>
</html>
