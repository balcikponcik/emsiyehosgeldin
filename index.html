<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emsi'ye Hoş Geldin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f4f93">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Emsi Oyun">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Gochi+Hand&family=Montserrat:wght@800&display=swap">
<style>
/* Layout: "Görevi Tamamla" afişi — mavi radyal zemin, el yazısı beyaz metin, kareli onay kutulu liste, altta EMSÎ */
:root{
  --deep:#1f4f93; --mid:#0d7cc6; --text:#ffffff; --soft:rgba(255,255,255,.78);
  --box:#e9e9ea; --box-ink:#1f4f93; --orange:#f7a23b; --shadow:rgba(6,24,60,.35);
  --title:"Chewy","Comic Sans MS",cursive;
  --hand:"Gochi Hand","Comic Sans MS",cursive;
  --logo:"Montserrat",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--deep)}
body{margin:0;min-height:100dvh;color:var(--text);font-family:var(--hand);font-size:20px;line-height:1.45;
  background:radial-gradient(ellipse 75% 60% at 50% 45%,var(--mid) 0%,#155fa8 45%,var(--deep) 100%) fixed,var(--deep);
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:26px;
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
h1{font-family:var(--title);font-weight:400;font-size:clamp(40px,10vw,74px);line-height:1;margin:0;letter-spacing:.02em;text-shadow:0 3px 0 var(--shadow)}
header svg{width:clamp(54px,12vw,92px);height:auto;flex:none;filter:drop-shadow(0 3px 2px var(--shadow))}
.sub{margin:-12px 0 0;text-align:center;color:var(--soft);font-size:19px}
.em{color:var(--orange)}
button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.draw{align-self:center;min-height:54px;padding:10px 30px;border-radius:14px;background:var(--orange);color:#3a2200;
  font-family:var(--title);font-size:26px;letter-spacing:.03em;box-shadow:0 5px 0 #c97a17,0 8px 18px var(--shadow);transition:transform .1s,box-shadow .1s}
.draw:active{transform:translateY(4px);box-shadow:0 1px 0 #c97a17,0 3px 8px var(--shadow)}
ol.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.task{display:grid;grid-template-columns:auto auto 1fr auto;align-items:start;gap:14px}
.box{width:44px;height:44px;border-radius:3px;background:var(--box);color:var(--box-ink);display:grid;place-items:center;padding:0;box-shadow:0 2px 0 var(--shadow)}
.box svg{width:30px;height:30px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s}
.task.done .box svg{opacity:1;transform:scale(1)}
.num{padding-top:5px;min-width:2ch;font-variant-numeric:tabular-nums}
.txt{padding-top:5px;min-width:0;overflow-wrap:anywhere;transition:opacity .2s}
.task.done .txt{opacity:.6;text-decoration:line-through;text-decoration-thickness:2px}
.swap{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--text);font-size:22px;line-height:1;display:grid;place-items:center}
.swap:hover{background:rgba(255,255,255,.24)}
.empty{text-align:center;color:var(--soft);border:2px dashed rgba(255,255,255,.4);border-radius:12px;padding:26px 16px}
.progress{text-align:center;color:var(--soft);font-size:18px}
.win{text-align:center;font-family:var(--title);font-size:28px;color:var(--orange);text-shadow:0 2px 0 var(--shadow)}
footer{margin-top:auto;display:flex;flex-direction:column;align-items:center;padding-top:20px}
.logo{font-family:var(--logo);font-weight:800;font-size:44px;letter-spacing:.02em;line-height:1}
.logo-shadow{width:150px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(6,24,60,.45),transparent);margin-top:6px}
@media (max-width:560px){
  body{font-size:19px}
  .wrap{gap:22px}
  .draw{align-self:stretch}
  .task{grid-template-columns:auto 1fr auto;gap:10px 12px}
  .num{display:none}
  .box{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>GÖREVİ TAMAMLA</h1>
    <svg viewBox="0 0 100 90" aria-hidden="true">
      <circle cx="58" cy="52" r="24" fill="#cfe2f5" stroke="#2b2f36" stroke-width="7"/>
      <circle cx="58" cy="52" r="15" fill="#e8f2fb" opacity=".7"/>
      <path d="M40 70 L14 86" stroke="#2b2f36" stroke-width="11" stroke-linecap="round"/>
      <ellipse cx="54" cy="30" rx="34" ry="8" fill="#2b2f36"/>
      <path d="M30 30 C30 10 40 4 54 4 C68 4 78 10 78 30 Z" fill="#3a3f47"/>
      <path d="M31 22 L77 22 L78 30 L30 30 Z" fill="#f2f2f2"/>
    </svg>
  </header>
  <p class="sub"><span class="em">Emsi</span>'ye hoş geldin! Rastgele 3 görev çek, hepsini tamamla.</p>

  <button class="draw" id="draw">3 GÖREV ÇEK</button>

  <ol class="tasks" id="tasks"></ol>
  <div class="progress" id="progress" hidden></div>
  <div class="win" id="win" hidden>Tebrikler, artık sen de <span class="em">Emsi</span>'lisin!</div>

  <footer>
    <div class="logo" aria-label="EMSÎ">EMSÎ</div>
    <div class="logo-shadow"></div>
  </footer>
</div>

<script>
const POOL = [
  "5 kişiyi bir araya topla ve fotoğraf çek",
  "etkinlik alanında oryantasyon liderini bul ve fotoğraf çek",
  "emsi'de 2 yıl ve üzeri bir kişiyi bul ve ona bir içki ısmarlat",
  "kalabalık bir grup içerisinde Çağrı göttür diye bağır",
  "mavi giyen 1 kişi bul ve fotoğraf çektir",
  "bir bardak su iç",
  "Oryantasyon liderinle fotoğraf çekil, Emsi Story’de paylaş.",
  "Arzumsu'yu bul.",
  "En az 1 yıldır EMSÎ üyesi olan bir arkadaşımızı bul, seni 3 eski üyeyle tanıştırsın.",
  "Emsi Tweet’e “Buradayım be buradayım! #artıkemsiliyim” yazıp paylaş!",
  "Ve en önemlisi, bolca eğlen!",
  "Oryantasyon ekibinden en az iki kişiyle tanışıp selfie çek",
  "Emsi story’e partiden bir fotoğraf at",
  "Çağrı göttür dendiğinde “Eyyyy” diyerek kadeh kaldır",
  "En az iki senedir toplulukta olan birinden sana bi bira ısmarlamasını iste (ısmarlamazsa göttür)",
  "Yılın Enleri adaylarından birine aday olmanın nasıl hissettirdiğini sor",
  "En az 20 kişiyle tanış, aynı meslekten 2 kişiyi tanıştır",
  "Emsi Tweet’e “Görevi tamamladım, artık ben de Emsi’liyim” yaz",
];
const N = 3, KEY = "emsi-oyun-v6";
let drawn = [];
try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) drawn = s.filter(d => POOL.includes(d.t)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(drawn)); } catch (e) {} };
const $ = id => document.getElementById(id);
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmt(s){return esc(s).replace(/(Emsi|EMSÎ|emsi)(?=[^a-zA-ZçğıöşüÇĞİÖŞÜ]|$)/g,'<span class="em">$1</span>')}

function draw(){ drawn = shuffle(POOL).slice(0, N).map(t => ({ t, done: false })); save(); render(); }
function swap(i){
  const used = new Set(drawn.map(d => d.t));
  const c = POOL.filter(t => !used.has(t));
  if (!c.length) return;
  drawn[i] = { t: c[Math.random() * c.length | 0], done: false }; save(); render();
}
function render(){
  const ol = $("tasks"), n = drawn.length, done = drawn.filter(d => d.done).length;
  ol.innerHTML = n ? drawn.map((d, i) => `
    <li class="task${d.done ? ' done' : ''}">
      <button class="box" data-c="${i}" aria-pressed="${d.done}" aria-label="Tamamlandı olarak işaretle">${CHECK}</button>
      <span class="num">${i + 1}-</span>
      <span class="txt">${fmt(d.t)}</span>
      <button class="swap" data-s="${i}" aria-label="Bu görevi değiştir" title="Görevi değiştir">↻</button>
    </li>`).join("")
    : '<li class="empty">“3 Görev Çek”e bas, görevlerin burada belirsin.</li>';
  $("progress").hidden = !n;
  $("progress").textContent = `${done} / ${n} görev tamamlandı`;
  $("win").hidden = !(n && done === n);
  $("draw").textContent = n ? "YENİDEN ÇEK" : "3 GÖREV ÇEK";
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "draw") draw();
  else if (b.dataset.c != null) { const d = drawn[+b.dataset.c]; d.done = !d.done; save(); render(); }
  else if (b.dataset.s != null) swap(+b.dataset.s);
});
render();
</script>
</body>
</html>
